name: Publish

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: linux-arm64
            runner: ubuntu-22.04-arm
          # Xcode 27 includes both toolchains for the .NET 11 macOS workload.
          - rid: osx-x64
            runner: xcode-27
          - rid: osx-arm64
            runner: xcode-27

    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      PUBLISH_PROJECT: src/BD.WTTS.Client.Tools.Publish/BD.WTTS.Client.Tools.Publish.csproj
      PUBLISH_RID: ${{ matrix.rid }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Read .NET SDK version
        id: sdk
        run: |
          # setup-dotnet resolves the latestMajor policy to the LTS channel.
          $sdkVersion = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
          if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
            throw 'global.json must specify sdk.version.'
          }
          "version=$sdkVersion" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Install Linux Native AOT dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake zlib1g-dev

      - name: Build Linux DTLS libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dtls_assets="$PWD/build/artifacts/native-dependencies/dtls/$PUBLISH_RID"
          bash build/native-dtls/build-linux.sh "$PUBLISH_RID" "$dtls_assets"
          printf 'WttsLinuxDtlsAssets=%s\n' "$dtls_assets" >> "$GITHUB_ENV"

      - name: Set up macOS publishing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          dotnet workload install macos --version 11.0.100.1

      - name: Build Intel macOS DTLS libraries
        if: matrix.rid == 'osx-x64'
        shell: bash
        run: bash build/native-dtls/build-macos-x64.sh

      - name: Checkout Windows installer templates
        if: runner.os == 'Windows' && github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: SteamTools-Team/NSIS-Build
          path: NSIS-Build
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: false

      - name: Publish packages
        env:
          WttsDesktopTargetFrameworks: ${{ runner.os == 'macOS' && 'net11.0-macos' || '' }}
        run: dotnet run --project $env:PUBLISH_PROJECT --configuration Release --no-launch-profile -- run --rids $env:PUBLISH_RID --aot true

      - name: Build Windows installers
        if: runner.os == 'Windows' && github.event_name == 'push'
        run: dotnet run --project $env:PUBLISH_PROJECT --configuration Release --no-launch-profile --no-build -- nsis --rids $env:PUBLISH_RID --t latest --aot true

      - name: Stage release packages
        run: |
          $publishDir = 'src/BD.WTTS.Client.Avalonia.App/bin/Release/Publish'
          $assetsDir = New-Item -ItemType Directory -Path ../release-assets -Force
          $rid = $env:PUBLISH_RID.Replace('-', '_')
          $extensions = switch ($env:RUNNER_OS) {
            'Linux' { '.tgz' }
            'macOS' { '.dmg' }
            default { '.7z' }
          }
          if ($env:RUNNER_OS -eq 'Windows' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $extensions = @($extensions, '.exe')
          }

          $files = Get-ChildItem -LiteralPath $publishDir -File
          foreach ($mode in 'JIT', 'AOT') {
            $product = if ($mode -eq 'AOT') { 'Steam++(Native AOT)' } else { 'Steam++' }
            $suffix = if ($mode -eq 'AOT') { '_aot' } else { '' }
            $escapedProduct = [regex]::Escape($product)
            foreach ($extension in $extensions) {
              $pattern = "^\[Release\] ${escapedProduct}_v(?<version>[^_]+)_${rid}_\d{6}_\d+$([regex]::Escape($extension))$"
              $packages = @($files | Where-Object Name -Match $pattern)
              if ($packages.Count -ne 1 -or $packages[0].Length -eq 0) {
                throw "Expected one nonempty $mode $extension package for $env:PUBLISH_RID."
              }

              $version = [regex]::Match($packages[0].Name, $pattern).Groups['version'].Value
              $assetName = "Steam++_v${version}_${rid}${suffix}${extension}"
              Copy-Item -LiteralPath $packages[0].FullName -Destination (Join-Path $assetsDir.FullName $assetName)
            }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Create draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: Generate package checksums
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath release-assets -File | Sort-Object Name)
          if ($packages.Count -eq 0) { throw 'No release packages were downloaded.' }

          $rows = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
            [pscustomobject]@{ Name = $package.Name; SHA256 = $hash }
          }
          $rows | ForEach-Object { "$($_.SHA256)  $($_.Name)" } |
            Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding ascii
          @(
            '## 文件校验'
            ''
            '| File | Checksum (SHA256) |'
            '| --- | --- |'
            $rows | ForEach-Object { "| $($_.Name) | $($_.SHA256) |" }
          ) | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Create or update the draft
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          skipIfReleaseExists: true
          draft: true
          artifactErrorsFailBuild: true
          artifacts: release-assets/*
          bodyFile: release-notes.md
          generateReleaseNotes: true
