name: "(English)Question \U0001F9D0"
description: Questions about using the program or need help
title: "\U0001F9D0[Question] Please enter a title"
labels: question
body:
  - type: markdown
    attributes:
      value: |
        Before posting, please try searching for your question in Issues to see if it has already been asked.  
        Don't forget to fill in the title, which should be a short description of the Question
  
  - type: checkboxes
    attributes:
        label: Please check each item in the following list carefully
        options:
        - label: I have searched and found no similar issues
          required: true
        - label: Have searched the documentation and found no relevant content
          required: true
        - label: I have tried to use the latest version, but the problem still exists
          required: true
        - label: The official version is used (no replacement and modification of the installation directory program files)
          required: true
          
  - type: textarea
    attributes:
      label: "🧐 Description"
      description: Describe the Question in detail so that everyone can understand it
    validations:
      required: true

  - type: textarea
    attributes:
      label: "🚑 Other Information"
      description: |
        Additional information such as screenshots can be posted here  
        example:  
          - Processor architecture: x64 / x86 / arm64  
          - System version number: example Windows 10.19042.844(see winver) / macOS Monterey 12 / Ubuntu 20.04.2 LTS  
          - Download channels: Microsoft Store / Official Website / Github / AppStore / xx netdisk  
          - Program version: 2.8.4
          - Does it contain a standalone runtime: with_runtime or without fde in the file name
      value: |
      - Processor architecture: 
      - System version number:
      - Download channels: 
      - Program version: 
      - Does it contain a standalone runtime:
 
